[project]
authors = [
  { name = "Ash Vardanian", email = "1983160+ashvardanian@users.noreply.github.com" },
]
dependencies = ["numba>=0.67", "numpy>=2.0"]
description = "ScalingElections: Condorcet Voting at GPU Speed — Schulze as semiring matrix multiplication, Kemeny-Young as exact NP-hard search"
name = "ScalingElections"
readme = "README.md"
requires-python = ">=3.12"
urls = { Homepage = "https://ashvardanian.com/posts/scaling-elections", Repository = "https://github.com/ashvardanian/ScalingElections" }
version = "0.2.0"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=83", "pybind11>=3.0.3"]

# The oracles the suite validates against, which no wheel of this project needs at runtime.
[project.optional-dependencies]
cpu = ["igraph>=0.11", "pref-voting>=1.18"]

[tool.uv]
# The checkers travel with every checkout, so a bare `uv sync` is enough to run the suite.
default-groups = ["lint", "test"]
# pref-voting caps numba below 0.63; it runs fine on 0.67, verified against its own methods.
override-dependencies = ["numba>=0.67"]

[tool.setuptools]
py-modules = ["scalingelections", "ballots", "schulze", "kemeny"]

[tool.pytest.ini_options]
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
filterwarnings = [
  "error",
  # OR-Tools' SWIG initializer crashes when these upstream deprecations become exceptions.
  "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]
markers = ["slow: the exhaustive Kemeny searches; deselect with -m 'not slow'"]
minversion = "6.0"
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = [
  "E501", # line too long, handled by the formatter
  "E741", # ambiguous variable names
]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort import ordering
  "UP",  # pyupgrade
  "YTT", # flake8-2020
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]

# Groups rather than extras, so the checkers stay out of the published wheel's metadata.
[dependency-groups]
lint = ["ruff>=0.15.8"]
test = ["pytest>=9.1", "pytest-repeat>=0.9.4"]
